version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: steam-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: steam_db
      MYSQL_USER: steam_user
      MYSQL_PASSWORD: steam123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steam-network

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/steam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      SERVER_PORT: 8000
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - steam-network

  # Vue 3 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steam-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - steam-network

networks:
  steam-network:
    driver: bridge

volumes:
  mysql_data:
